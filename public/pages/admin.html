<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — LinkHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 60px);
    }

    .admin-sidebar {
      background: var(--branco);
      border-right: 1px solid var(--cinza-borda);
      padding: 24px 0;
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
      overflow-y: auto;
    }

    .sidebar-titulo {
      padding: 0 20px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cinza-texto);
      border-bottom: 1px solid var(--cinza-borda);
      margin-bottom: 8px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 0.9rem;
      color: var(--preto);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font);
    }
    .sidebar-item:hover { background: var(--cinza-fundo); }
    .sidebar-item.ativo { background: var(--verde-pale); color: var(--verde-escuro); font-weight: 500; }

    .sidebar-badge {
      margin-left: auto;
      background: var(--vermelho);
      color: var(--branco);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      min-width: 20px;
      text-align: center;
    }

    .admin-conteudo {
      padding: 28px 32px;
      overflow-y: auto;
    }

    .admin-titulo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
    }
    .admin-titulo h1 { font-size: 1.4rem; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--branco);
      border: 1px solid var(--cinza-borda);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
    }
    .stat-numero { font-size: 2rem; font-weight: 700; color: var(--preto); line-height: 1; }
    .stat-label { font-size: 0.8rem; color: var(--cinza-texto); margin-top: 6px; }

    .tabela-admin {
      background: var(--branco);
      border: 1px solid var(--cinza-borda);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .tabela-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--cinza-borda);
      gap: 12px;
    }

    .tabela-cabecalho h2 { font-size: 1rem; }

    .item-pendente {
      border-bottom: 1px solid var(--cinza-borda);
      padding: 20px;
      transition: background 0.12s;
    }
    .item-pendente:last-child { border-bottom: none; }
    .item-pendente:hover { background: #fafafa; }

    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .item-nome { font-size: 1rem; font-weight: 600; flex: 1; min-width: 200px; }
    .item-meta { font-size: 0.8rem; color: var(--cinza-texto); display: flex; flex-direction: column; gap: 2px; }

    .item-desc {
      font-size: 0.875rem;
      color: var(--cinza-texto);
      line-height: 1.5;
      margin: 10px 0;
    }

    .item-link {
      font-size: 0.875rem;
      color: var(--verde-medio);
      word-break: break-all;
    }

    .item-acoes {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .area-rejeicao {
      margin-top: 12px;
      display: none;
    }
    .area-rejeicao.aberta { display: block; }

    .filtro-status {
      display: flex;
      gap: 4px;
    }
    .filtro-status button {
      padding: 6px 14px;
      border: 1.5px solid var(--cinza-borda);
      border-radius: 20px;
      background: var(--branco);
      font-size: 0.8rem;
      font-family: var(--font);
      cursor: pointer;
      color: var(--preto);
      transition: all 0.15s;
    }
    .filtro-status button.ativo { background: var(--verde-escuro); color: var(--branco); border-color: var(--verde-escuro); }

    @media (max-width: 768px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--cinza-borda); padding: 12px 0; }
      .admin-conteudo { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<header class="navbar" id="navbar"></header>

<div class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-titulo">Moderação</div>
    <button class="sidebar-item ativo" onclick="mostrarSecao('pendentes', this)" id="btn-pendentes">
      ⏳ Pendentes
      <span class="sidebar-badge" id="badge-pendentes" style="display:none">0</span>
    </button>
    <button class="sidebar-item" onclick="mostrarSecao('aprovados', this)">
      ✅ Aprovados
    </button>
    <button class="sidebar-item" onclick="mostrarSecao('rejeitados', this)">
      ❌ Rejeitados
    </button>
    <div class="sidebar-titulo" style="margin-top: 20px;">Gerenciar</div>
    <button class="sidebar-item" onclick="mostrarSecao('usuarios', this)">
      👥 Usuários
    </button>
  </aside>

  <main class="admin-conteudo">

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-numero" id="stat-pendentes">—</div><div class="stat-label">Pendentes</div></div>
      <div class="stat-card"><div class="stat-numero" id="stat-aprovados">—</div><div class="stat-label">Aprovados</div></div>
      <div class="stat-card"><div class="stat-numero" id="stat-rejeitados">—</div><div class="stat-label">Rejeitados</div></div>
      <div class="stat-card"><div class="stat-numero" id="stat-usuarios">—</div><div class="stat-label">Usuários</div></div>
    </div>

    <div id="secao-pendentes">
      <div class="admin-titulo">
        <h1>Grupos pendentes</h1>
        <button class="btn btn-contorno btn-sm" onclick="carregarPendentes()">↻ Atualizar</button>
      </div>
      <div class="tabela-admin" id="lista-pendentes">
        <div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>
      </div>
    </div>

    <div id="secao-aprovados" style="display:none">
      <div class="admin-titulo">
        <h1>Grupos aprovados</h1>
        <button class="btn btn-contorno btn-sm" onclick="carregarAprovados()">↻ Atualizar</button>
      </div>
      <div class="tabela-admin" id="lista-aprovados">
        <div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>
      </div>
    </div>

    <div id="secao-rejeitados" style="display:none">
      <div class="admin-titulo">
        <h1>Grupos rejeitados</h1>
      </div>
      <div class="tabela-admin" id="lista-rejeitados">
        <div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>
      </div>
    </div>

    <div id="secao-usuarios" style="display:none">
      <div class="admin-titulo">
        <h1>Usuários cadastrados</h1>
        <button class="btn btn-contorno btn-sm" onclick="carregarUsuarios()">↻ Atualizar</button>
      </div>
      <div class="tabela-admin" id="lista-usuarios">
        <div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>
      </div>
    </div>

  </main>
</div>

<script src="/js/utils.js"></script>
<script>
  function esc(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str || ''));
    return d.innerHTML;
  }

  function mostrarSecao(nome, btn) {
    ['pendentes', 'aprovados', 'rejeitados', 'usuarios'].forEach(s => {
      document.getElementById('secao-' + s).style.display = s === nome ? 'block' : 'none';
    });
    document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');

    if (nome === 'pendentes') carregarPendentes();
    else if (nome === 'aprovados') carregarAprovados();
    else if (nome === 'rejeitados') carregarRejeitados();
    else if (nome === 'usuarios') carregarUsuarios();
  }

  async function carregarStats() {
    try {
      const s = await apiFetch('/admin/stats');
      document.getElementById('stat-pendentes').textContent = s.pendentes;
      document.getElementById('stat-aprovados').textContent = s.aprovados;
      document.getElementById('stat-rejeitados').textContent = s.rejeitados;
      document.getElementById('stat-usuarios').textContent = s.usuarios;
      const badge = document.getElementById('badge-pendentes');
      if (s.pendentes > 0) {
        badge.textContent = s.pendentes;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    } catch {}
  }

  async function carregarPendentes() {
    const el = document.getElementById('lista-pendentes');
    el.innerHTML = '<div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>';
    try {
      const grupos = await apiFetch('/admin/pendentes');
      if (grupos.length === 0) {
        el.innerHTML = '<div class="estado-vazio" style="padding:60px 20px"><div class="estado-vazio-icone">🎉</div><h3>Nenhum grupo pendente</h3><p>Tudo em dia!</p></div>';
        return;
      }
      el.innerHTML = grupos.map(g => `
        <div class="item-pendente" id="pendente-${g.id}">
          <div class="item-header">
            <div>
              <div class="item-nome">${esc(g.nome_grupo)}</div>
              <div class="item-meta">
                <span>Categoria: ${esc(g.categoria_nome)}</span>
                <span>Contato: ${esc(g.nome_contato)} · ${esc(g.email_contato)}</span>
                <span>Enviado: ${formatarData(g.criado_em)}</span>
                ${g.usuario_nome ? `<span>Usuário: ${esc(g.usuario_nome)}</span>` : ''}
              </div>
            </div>
            <span class="tag tag-amarelo">Pendente</span>
          </div>
          <p class="item-desc">${esc(g.descricao)}</p>
          <a href="${esc(g.link_whatsapp)}" target="_blank" rel="noopener" class="item-link">${esc(g.link_whatsapp)}</a>
          <div class="item-acoes">
            <button class="btn btn-contorno btn-sm" onclick="aprovar(${g.id}, this)" style="color:var(--verde-medio);border-color:#b7e4c7">
              ✓ Aprovar
            </button>
            <button class="btn btn-contorno btn-sm" onclick="toggleRejeitar(${g.id})" style="color:var(--vermelho)">
              ✗ Rejeitar
            </button>
          </div>
          <div class="area-rejeicao" id="rejeicao-${g.id}">
            <div style="display:flex;gap:8px;margin-top:12px">
              <textarea class="form-textarea" id="motivo-${g.id}" placeholder="Informe o motivo da rejeição para o usuário..." style="min-height:70px;flex:1"></textarea>
              <button class="btn btn-perigo btn-sm" onclick="rejeitar(${g.id}, this)" style="align-self:flex-end">Enviar</button>
            </div>
          </div>
        </div>
      `).join('');
    } catch (err) {
      el.innerHTML = `<div style="padding:20px;color:var(--vermelho)">${err.message}</div>`;
    }
  }

  function toggleRejeitar(id) {
    const area = document.getElementById('rejeicao-' + id);
    area.classList.toggle('aberta');
    if (area.classList.contains('aberta')) {
      document.getElementById('motivo-' + id).focus();
    }
  }

  async function aprovar(id, btn) {
    if (!confirm('Confirmar aprovação deste grupo?')) return;
    btnCarregando(btn, true);
    try {
      await apiFetch('/admin/aprovar/' + id, { method: 'POST' });
      document.getElementById('pendente-' + id).style.opacity = '0.4';
      setTimeout(() => {
        document.getElementById('pendente-' + id).remove();
        carregarStats();
      }, 600);
    } catch (err) {
      alert(err.message);
      btnCarregando(btn, false);
    }
  }

  async function rejeitar(id, btn) {
    const motivo = document.getElementById('motivo-' + id).value.trim();
    if (motivo.length < 10) return alert('Informe o motivo com pelo menos 10 caracteres.');
    btnCarregando(btn, true);
    try {
      await apiFetch('/admin/rejeitar/' + id, {
        method: 'POST',
        body: JSON.stringify({ motivo })
      });
      document.getElementById('pendente-' + id).style.opacity = '0.4';
      setTimeout(() => {
        document.getElementById('pendente-' + id).remove();
        carregarStats();
      }, 600);
    } catch (err) {
      alert(err.message);
      btnCarregando(btn, false);
    }
  }

  async function carregarAprovados() {
    const el = document.getElementById('lista-aprovados');
    el.innerHTML = '<div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>';
    try {
      const grupos = await apiFetch('/admin/grupos?status=aprovado');
      if (grupos.length === 0) {
        el.innerHTML = '<div class="estado-vazio" style="padding:40px">Nenhum grupo aprovado ainda.</div>';
        return;
      }
      el.innerHTML = grupos.map(g => `
        <div class="item-pendente" id="grupo-${g.id}">
          <div class="item-header">
            <div>
              <div class="item-nome">${esc(g.nome_grupo)}</div>
              <div class="item-meta">
                <span>${esc(g.categoria_nome)} · Aprovado em ${formatarData(g.aprovado_em)}</span>
                <span>Contato: ${esc(g.email_contato)}</span>
              </div>
            </div>
            <span class="tag tag-verde">Aprovado</span>
          </div>
          <p class="item-desc">${esc(g.descricao)}</p>
          <a href="${esc(g.link_whatsapp)}" target="_blank" rel="noopener" class="item-link">${esc(g.link_whatsapp)}</a>
          <div class="item-acoes">
            <button class="btn btn-perigo btn-sm" onclick="removerGrupo(${g.id}, this)">🗑 Remover do site</button>
          </div>
        </div>
      `).join('');
    } catch (err) {
      el.innerHTML = `<div style="padding:20px;color:var(--vermelho)">${err.message}</div>`;
    }
  }

  async function carregarRejeitados() {
    const el = document.getElementById('lista-rejeitados');
    el.innerHTML = '<div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>';
    try {
      const grupos = await apiFetch('/admin/grupos?status=rejeitado');
      if (grupos.length === 0) {
        el.innerHTML = '<div class="estado-vazio" style="padding:40px">Nenhum grupo rejeitado.</div>';
        return;
      }
      el.innerHTML = grupos.map(g => `
        <div class="item-pendente">
          <div class="item-header">
            <div class="item-nome">${esc(g.nome_grupo)}</div>
            <span class="tag tag-vermelho">Rejeitado</span>
          </div>
          <div class="item-meta" style="margin-bottom:8px">
            <span>${esc(g.categoria_nome)} · ${esc(g.email_contato)}</span>
          </div>
          <p class="item-desc">${esc(g.descricao)}</p>
          <button class="btn btn-perigo btn-sm" onclick="removerGrupo(${g.id}, this)" style="margin-top:10px">🗑 Remover</button>
        </div>
      `).join('');
    } catch (err) {
      el.innerHTML = `<div style="padding:20px;color:var(--vermelho)">${err.message}</div>`;
    }
  }

  async function removerGrupo(id, btn) {
    if (!confirm('Remover este grupo permanentemente? Esta ação não pode ser desfeita.')) return;
    btnCarregando(btn, true);
    try {
      await apiFetch('/admin/grupo/' + id, { method: 'DELETE' });
      btn.closest('.item-pendente').remove();
      carregarStats();
    } catch (err) {
      alert(err.message);
      btnCarregando(btn, false);
    }
  }

  async function carregarUsuarios() {
    const el = document.getElementById('lista-usuarios');
    el.innerHTML = '<div style="padding:40px;text-align:center"><span class="spinner spinner-verde" style="display:inline-block"></span></div>';
    try {
      const usuarios = await apiFetch('/admin/usuarios');
      el.innerHTML = usuarios.map(u => `
        <div class="item-pendente" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <strong>${esc(u.nome)}</strong>
            <div class="item-meta"><span>${esc(u.email)}</span><span>Cadastro: ${formatarData(u.criado_em)}</span></div>
          </div>
          <span class="tag ${u.role === 'admin' ? 'tag-verde' : 'tag-cinza'}">${u.role}</span>
          <span class="tag ${u.ativo ? 'tag-verde' : 'tag-vermelho'}">${u.ativo ? 'Ativo' : 'Inativo'}</span>
          ${u.role !== 'admin' ? `<button class="btn btn-contorno btn-sm" onclick="toggleUsuario(${u.id}, this)">${u.ativo ? 'Desativar' : 'Ativar'}</button>` : ''}
        </div>
      `).join('');
    } catch (err) {
      el.innerHTML = `<div style="padding:20px;color:var(--vermelho)">${err.message}</div>`;
    }
  }

  async function toggleUsuario(id, btn) {
    btnCarregando(btn, true);
    try {
      const resp = await apiFetch('/admin/usuario/' + id + '/toggle-ativo', { method: 'POST' });
      carregarUsuarios();
    } catch (err) {
      alert(err.message);
      btnCarregando(btn, false);
    }
  }

  async function montar() {
    const sessao = await iniciarPagina({ requerAdmin: true });
    if (!sessao) return;
    carregarStats();
    carregarPendentes();
    setInterval(carregarStats, 30000);
  }

  montar();
</script>
</body>
</html>
