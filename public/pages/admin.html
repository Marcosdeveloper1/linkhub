<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — WhatsApp Grupos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .pagina-admin { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }
    .admin-cabecalho { margin-bottom: 24px; }
    .admin-abas { display: flex; gap: 4px; border-bottom: 1px solid var(--cinza-borda); margin-bottom: 24px; flex-wrap: wrap; }
    .admin-aba {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--cinza-texto);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      background: none;
      border-left: none; border-right: none; border-top: none;
      font-family: var(--font);
    }
    .admin-aba.ativa { color: var(--verde-escuro); border-bottom-color: var(--verde-claro); }
    .lista-solicitacoes { display: flex; flex-direction: column; gap: 14px; }
    .solicitacao-card { display: flex; flex-direction: column; gap: 10px; }
    .solicitacao-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .solicitacao-nome { font-size: 1.05rem; font-weight: 600; }
    .solicitacao-meta { font-size: 0.8rem; color: var(--cinza-texto); margin-top: 2px; }
    .solicitacao-desc { font-size: 0.9rem; color: var(--preto); line-height: 1.5; }
    .solicitacao-contato { font-size: 0.825rem; color: var(--cinza-texto); }
    .solicitacao-acoes { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .motivo-rejeicao-exibido {
      background: #fff5f5;
      border-left: 3px solid var(--vermelho);
      padding: 8px 12px;
      font-size: 0.825rem;
      color: #842029;
      border-radius: 4px;
    }

    /* checkboxes de regras (importação em lote) */
    .regras-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      background: var(--cinza-fundo);
      border: 1px solid var(--cinza-borda);
      border-radius: var(--radius);
    }

    .regra-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      cursor: pointer;
      user-select: none;
    }

    .regra-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--verde-escuro);
      cursor: pointer;
      flex-shrink: 0;
    }

    .descricao-preview {
      font-size: 0.78rem;
      color: var(--cinza-texto);
      margin-top: 4px;
    }

    .modal-lote { max-width: 640px; }
    .modal-lote .form-grupo { margin-bottom: 16px; }
    .modal-lote .form-label { margin-bottom: 6px; display: block; }

    /* barra de ferramentas da aba Aprovados: filtro, busca, ações em lote */
    .barra-ferramentas {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--cinza-fundo);
      border: 1px solid var(--cinza-borda);
      border-radius: var(--radius);
    }
    .barra-ferramentas .form-select,
    .barra-ferramentas .form-input {
      max-width: 220px;
      padding: 7px 12px;
      font-size: 0.85rem;
    }
    .barra-ferramentas-acoes {
      margin-left: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* checkbox de seleção no card (aba Aprovados) */
    .solicitacao-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--verde-escuro);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .card-selecionado {
      border-color: var(--verde-claro);
      background: var(--verde-pale);
    }

    .barra-selecao {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: var(--verde-pale);
      border: 1px solid var(--verde-claro);
      border-radius: var(--radius);
      margin-bottom: 12px;
      font-size: 0.875rem;
      color: var(--verde-escuro);
    }
    .barra-selecao.visivel { display: flex; }

    .tag-status-indisponivel {
      background: #fff3cd;
      color: #856404;
    }

    .erro-relato-card {
      border-left: 4px solid var(--verde-claro);
    }
    .erro-relato-card.resolvido {
      border-left-color: var(--cinza-borda);
      opacity: 0.78;
    }
    .erro-relato-topo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .erro-relato-tipo {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--preto);
    }
    .erro-relato-texto {
      background: #f8fafc;
      border: 1px solid var(--cinza-borda);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--cinza-texto);
      line-height: 1.5;
      font-size: 0.875rem;
      margin-top: 10px;
    }
    .tag-status-resolvido {
      background: #eef2f7;
      color: #475569;
    }
  </style>
</head>
<body>

<header class="navbar" id="navbar"></header>

<main class="pagina-admin">
  <div class="admin-cabecalho">
    <h1>Painel Admin</h1>
    <p style="color:var(--cinza-texto); margin-top:6px;">Aprove, rejeite ou remova grupos cadastrados na plataforma.</p>
  </div>

  <div class="admin-abas">
    <button class="admin-aba ativa" data-status="pendente">Pendentes</button>
    <button class="admin-aba" data-status="aprovado">Aprovados</button>
    <button class="admin-aba" data-status="rejeitado">Rejeitados</button>
    <button class="admin-aba" data-status="erros">Erros relatados</button>
    <button class="btn btn-contorno btn-sm" id="btn-importar-lote" style="margin-left:auto;">Importar em lote</button>
  </div>

  <!-- Barra de ferramentas: só aparece na aba Aprovados -->
  <div class="barra-ferramentas" id="barra-ferramentas-aprovados" style="display:none;">
    <select class="form-select" id="filtro-categoria-aprovados">
      <option value="">Todas as categorias</option>
    </select>
    <input type="search" class="form-input" id="busca-nome-aprovados" placeholder="Buscar por nome...">
    <div class="barra-ferramentas-acoes">
      <button class="btn btn-contorno btn-sm" id="btn-verificar-links">Verificar links</button>
    </div>
  </div>

  <!-- Botão "Limpar rejeitados": só aparece na aba Rejeitados -->
  <div id="barra-rejeitados" style="display:none; margin-bottom:16px;">
    <button class="btn btn-perigo btn-sm" id="btn-limpar-rejeitados">Limpar todos os rejeitados</button>
  </div>

  <!-- Barra de seleção múltipla: só aparece quando há cards marcados na aba Aprovados -->
  <div class="barra-selecao" id="barra-selecao">
    <span id="texto-selecao">0 selecionados</span>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-contorno btn-sm" id="btn-limpar-selecao">Limpar seleção</button>
      <button class="btn btn-perigo btn-sm" id="btn-remover-selecionados">Remover selecionados</button>
    </div>
  </div>

  <div id="lista-area" class="lista-solicitacoes">
    <p style="color:var(--cinza-texto);">Carregando...</p>
  </div>
</main>

<!-- Modal de rejeição -->
<div class="modal-fundo" id="modal-rejeitar">
  <div class="modal-caixa">
    <button class="modal-fechar" id="fechar-modal-rejeitar">&times;</button>
    <h3 class="modal-titulo">Rejeitar solicitação</h3>
    <div id="aviso-rejeitar" class="aviso"></div>
    <div class="form-grupo">
      <label class="form-label" for="motivo-rejeicao">Motivo da rejeição</label>
      <textarea class="form-textarea" id="motivo-rejeicao" placeholder="Explique objetivamente por que o grupo não foi aprovado. O usuário receberá este texto por email." minlength="5" maxlength="500"></textarea>
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-contorno" id="cancelar-rejeitar">Cancelar</button>
      <button class="btn btn-perigo" id="confirmar-rejeitar" style="border-color:var(--vermelho); background:var(--vermelho); color:#fff;">Confirmar rejeição</button>
    </div>
  </div>
</div>

<!-- Modal de importação em lote -->
<div class="modal-fundo" id="modal-importar">
  <div class="modal-caixa modal-lote">
    <button class="modal-fechar" id="fechar-modal-importar">&times;</button>
    <h3 class="modal-titulo">Importar grupos em lote</h3>

    <div id="aviso-importar" class="aviso"></div>

    <!-- Categoria -->
    <div class="form-grupo">
      <label class="form-label" for="lote-categoria">Categoria <span style="color:var(--vermelho)">*</span></label>
      <select class="form-select" id="lote-categoria">
        <option value="">Selecione a categoria do lote...</option>
      </select>
    </div>

    <!-- Descrição genérica -->
    <div class="form-grupo">
      <label class="form-label" for="lote-descricao">Descrição genérica <span style="color:var(--vermelho)">*</span></label>
      <textarea class="form-textarea" id="lote-descricao" rows="3" maxlength="500" placeholder="Será aplicada a todos os grupos deste lote. Edite conforme necessário."></textarea>
      <p class="descricao-preview">Preenchida automaticamente ao escolher a categoria. Você pode editar.</p>
    </div>

    <!-- Regras -->
    <div class="form-grupo">
      <label class="form-label">Regras do grupo (marque as que se aplicam)</label>
      <div class="regras-lista" id="regras-lista">
        <label class="regra-item"><input type="checkbox" value="Proibido conteúdo adulto"> Proibido conteúdo adulto</label>
        <label class="regra-item"><input type="checkbox" value="Proibido conteúdo agressivo"> Proibido conteúdo agressivo</label>
        <label class="regra-item"><input type="checkbox" value="Proibido uso de palavrões"> Proibido uso de palavrões</label>
        <label class="regra-item"><input type="checkbox" value="Proibido trava zap"> Proibido trava zap</label>
        <label class="regra-item"><input type="checkbox" value="Proibido menor de idade"> Proibido menor de idade</label>
        <label class="regra-item"><input type="checkbox" value="Proibido enviar links"> Proibido enviar links</label>
        <label class="regra-item"><input type="checkbox" value="Proibido spam"> Proibido spam</label>
        <label class="regra-item"><input type="checkbox" value="Respeitar todos os membros"> Respeitar todos os membros</label>
      </div>
    </div>

    <!-- Links -->
    <div class="form-grupo">
      <label class="form-label" for="campo-importar-lote">Links dos grupos <span style="color:var(--vermelho)">*</span></label>
      <textarea class="form-textarea" id="campo-importar-lote" rows="7" placeholder="Um link por linha:
https://chat.whatsapp.com/ABC123...
https://chat.whatsapp.com/XYZ789..."></textarea>
      <p class="descricao-preview">Máximo de 50 links por importação.</p>
    </div>

    <div id="resultado-importacao" style="margin-top:4px; font-size:0.85rem;"></div>

    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-contorno" id="cancelar-importar">Fechar</button>
      <button class="btn btn-primario" id="confirmar-importar">Importar</button>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  iniciarPagina({ requerAdmin: true });

  let abaAtual = 'pendente';
  let idEmRejeicao = null;
  let categoriaFiltro = '';
  let buscaNome = '';
  let idsSelecionados = new Set();
  let gruposCarregados = []; // cache da última lista renderizada, usado pra "selecionar todos" etc.

  // descrições genéricas por categoria
  const descricoesPorCategoria = {
    amizade: 'Grupo de amizade, conversas e novas conexões. Participe com respeito e interaja com a comunidade.',
    relacionamento: 'Grupo sobre relacionamento, amor e novas conexões. Converse com respeito e clareza.',
    carros: 'Grupo sobre carros, motos, mecânica e veículos. Compartilhe dicas, dúvidas e novidades.',
    cidade: 'Grupo local para moradores, eventos, informações e oportunidades da cidade ou região.',
    'compras-e-vendas': 'Grupo para compra, venda, ofertas e negociações. Combine tudo com segurança e responsabilidade.',
    concursos: 'Grupo sobre concursos, estudos e preparação. Compartilhe materiais, editais e dicas.',
    desenhos: 'Grupo sobre desenhos, animes e cultura geek. Participe e compartilhe conteúdos do tema.',
    divulgacao: 'Grupo para divulgação, links e comunidades. Divulgue com moderação e respeite as regras.',
    educacao: 'Grupo educativo para troca de conhecimento, cursos, dicas de estudo e materiais de apoio.',
    emagrecimento: 'Grupo sobre emagrecimento, rotina fitness e hábitos saudáveis. Troque experiências com respeito.',
    financas: 'Grupo sobre dinheiro, finanças, renda e educação financeira. Troque dicas e experiências.',
    investimentos: 'Grupo sobre investimentos, mercado e finanças. Compartilhe informações e aprenda com a comunidade.',
    links: 'Grupo para compartilhar links úteis, comunidades e indicações relacionadas ao tema.',
    receitas: 'Grupo sobre receitas, culinária e comida. Compartilhe pratos, dicas e experiências.',
    religiao: 'Grupo sobre religião, fé e comunidades religiosas. Participe com respeito.',
    turismo: 'Grupo sobre turismo, viagens, passeios e dicas de lugares.',
    politica: 'Grupo de debate político. Discuta notícias, eleições e temas de interesse público com respeito.',
    tecnologia: 'Grupo de tecnologia, programação e inovação. Compartilhe novidades e tire dúvidas.',
    saude: 'Grupo sobre saúde, bem-estar e qualidade de vida. Compartilhe informações com responsabilidade.',
    entretenimento: 'Grupo de entretenimento, séries, filmes, vídeos e diversão.',
    empregos: 'Grupo de vagas de emprego e oportunidades de trabalho. Compartilhe e encontre oportunidades.',
    negocios: 'Grupo de negócios, vendas e empreendedorismo. Conecte-se com outros empreendedores.',
    esportes: 'Grupo de discussão sobre esportes e futebol. Compartilhe resultados, notícias e opiniões.',
    outros: 'Grupo de discussão geral. Participe e interaja com a comunidade.'
  };

  async function carregarLista() {
    const area = document.getElementById('lista-area');
    area.innerHTML = '<p style="color:var(--cinza-texto);">Carregando...</p>';

    // mostra/esconde a barra de ferramentas certa pra cada aba
    document.getElementById('barra-ferramentas-aprovados').style.display = abaAtual === 'aprovado' ? 'flex' : 'none';
    document.getElementById('barra-rejeitados').style.display = abaAtual === 'rejeitado' ? 'block' : 'none';

    if (abaAtual !== 'aprovado') {
      idsSelecionados.clear();
      atualizarBarraSelecao();
    }

    try {
      if (abaAtual === 'erros') {
        const relatos = await apiFetch('/admin/erros');
        renderizarErros(relatos);
        return;
      }

      let endpoint;
      if (abaAtual === 'pendente') {
        endpoint = '/admin/pendentes';
      } else {
        const params = new URLSearchParams({ status: abaAtual });
        if (abaAtual === 'aprovado') {
          if (categoriaFiltro) params.set('categoria', categoriaFiltro);
          if (buscaNome) params.set('busca', buscaNome);
        }
        endpoint = `/admin/grupos?${params}`;
      }

      const grupos = await apiFetch(endpoint);
      gruposCarregados = grupos;
      renderizarLista(grupos);
    } catch (err) {
      area.innerHTML = `<p style="color:var(--vermelho);">${err.message}</p>`;
    }
  }


  function renderizarErros(relatos) {
    const area = document.getElementById('lista-area');

    if (!relatos || relatos.length === 0) {
      area.innerHTML = `
        <div class="estado-vazio">
          <h3>Nenhum erro relatado</h3>
          <p>Quando usuários cadastrados comunicarem problemas em grupos, eles aparecerão aqui.</p>
        </div>
      `;
      return;
    }

    area.innerHTML = relatos.map((r) => `
      <div class="card solicitacao-card erro-relato-card ${r.status === 'resolvido' ? 'resolvido' : ''}" data-id="${r.id}">
        <div class="erro-relato-topo">
          <div style="flex:1;">
            <div class="erro-relato-tipo">${escaparHtml(r.tipo_label || r.tipo || 'Erro relatado')}</div>
            <div class="solicitacao-meta">
              <span class="tag ${r.status === 'resolvido' ? 'tag-status-resolvido' : 'tag-verde'}">${r.status === 'resolvido' ? 'Resolvido' : 'Pendente'}</span>
              · Relatado em ${formatarData(r.criado_em)}
              ${r.resolvido_em ? `· Resolvido em ${formatarData(r.resolvido_em)}` : ''}
            </div>
          </div>
        </div>

        <div class="solicitacao-contato">
          <strong>Grupo:</strong> ${escaparHtml(r.nome_grupo || 'Grupo removido')}<br>
          <strong>Categoria:</strong> ${escaparHtml(r.categoria_nome || 'Sem categoria')}<br>
          <strong>Usuário:</strong> ${escaparHtml(r.usuario_nome || 'Usuário')} — ${escaparHtml(r.usuario_email || '')}<br>
          <strong>Link:</strong> ${r.link_whatsapp ? `<a href="${escaparHtml(r.link_whatsapp)}" target="_blank" rel="noopener">${escaparHtml(r.link_whatsapp)}</a>` : 'Sem link'}
        </div>

        ${r.descricao ? `<div class="erro-relato-texto">${escaparHtml(r.descricao).replace(/\n/g, '<br>')}</div>` : ''}

        <div class="solicitacao-acoes">
          <a class="btn btn-contorno btn-sm" href="/pages/grupo.html?id=${r.grupo_id}" target="_blank" rel="noopener">Abrir grupo</a>
          ${r.status !== 'resolvido' ? `<button class="btn btn-primario btn-sm" data-acao="erro-resolver" data-id="${r.id}">Marcar como resolvido</button>` : ''}
          <button class="btn btn-perigo btn-sm" data-acao="erro-remover" data-id="${r.id}">Remover relato</button>
        </div>
      </div>
    `).join('');
  }

  function renderizarLista(grupos) {
    const area = document.getElementById('lista-area');

    if (grupos.length === 0) {
      area.innerHTML = `
        <div class="estado-vazio">
          <h3>Nada por aqui</h3>
          <p>Não há grupos com este status no momento.</p>
        </div>
      `;
      return;
    }

    const mostrarCheckbox = abaAtual === 'aprovado';

    area.innerHTML = grupos.map(g => `
      <div class="card solicitacao-card ${idsSelecionados.has(g.id) ? 'card-selecionado' : ''}" data-id="${g.id}">
        <div class="solicitacao-topo">
          ${mostrarCheckbox ? `<input type="checkbox" class="solicitacao-checkbox" data-id="${g.id}" ${idsSelecionados.has(g.id) ? 'checked' : ''}>` : ''}
          ${g.foto_url ? `<img src="${escaparHtml(g.foto_url)}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;">` : ''}
          <div style="flex:1;">
            <div class="solicitacao-nome">${escaparHtml(g.nome_grupo)}</div>
            <div class="solicitacao-meta">
              <span class="tag tag-verde">${escaparHtml(g.categoria_nome)}</span>
              ${g.status === 'indisponivel' ? `<span class="tag tag-status-indisponivel">Link indisponível</span>` : ''}
              · Enviado em ${formatarData(g.criado_em)}
            </div>
          </div>
        </div>
        <div class="solicitacao-desc">${escaparHtml(g.descricao)}</div>
        <div class="solicitacao-contato">
          Link: <a href="${g.link_whatsapp}" target="_blank" rel="noopener">${g.link_whatsapp}</a><br>
          Contato: ${escaparHtml(g.nome_contato)} — ${escaparHtml(g.email_contato)}
        </div>
        ${g.status === 'pendente' ? `
          <div class="solicitacao-detalhe-expandido" style="display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--cinza-borda); font-size:0.85rem;">
            <p><strong>Nome do grupo:</strong> ${escaparHtml(g.nome_grupo)}</p>
            <p><strong>Categoria:</strong> ${escaparHtml(g.categoria_nome)}</p>
            <p><strong>Descrição completa:</strong> ${escaparHtml(g.descricao)}</p>
            ${g.regras ? `<p><strong>Regras informadas:</strong><br>${escaparHtml(g.regras).replace(/\n/g, '<br>')}</p>` : ''}
            <p><strong>Link:</strong> <a href="${escaparHtml(g.link_whatsapp)}" target="_blank" rel="noopener">${escaparHtml(g.link_whatsapp)}</a></p>
            <p><strong>Nome do solicitante:</strong> ${escaparHtml(g.nome_contato)}</p>
            <p><strong>Email do solicitante:</strong> ${escaparHtml(g.email_contato)}</p>
            <p><strong>Enviado em:</strong> ${formatarData(g.criado_em)}</p>
          </div>
          <button class="btn btn-contorno btn-sm btn-ver-detalhes" data-id="${g.id}" style="margin-top:8px;">Ver detalhes completos</button>
        ` : ''}
        ${g.status === 'rejeitado' && g.motivo_rejeicao ? `
          <div class="motivo-rejeicao-exibido">Motivo: ${escaparHtml(g.motivo_rejeicao)}</div>
        ` : ''}
        <div class="solicitacao-acoes">
          ${g.status === 'pendente' ? `
            <button class="btn btn-primario btn-sm" data-acao="aprovar" data-id="${g.id}">Aprovar</button>
            <button class="btn btn-perigo btn-sm" data-acao="rejeitar" data-id="${g.id}">Rejeitar</button>
          ` : ''}
          ${g.status === 'aprovado' || g.status === 'indisponivel' ? `
            <button class="btn btn-perigo btn-sm" data-acao="remover" data-id="${g.id}">Remover do site</button>
          ` : ''}
        </div>
      </div>
    `).join('');

    area.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', () => { img.style.display = 'none'; });
    });
  }

  function escaparHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function atualizarBarraSelecao() {
    const barra = document.getElementById('barra-selecao');
    const texto = document.getElementById('texto-selecao');
    if (idsSelecionados.size > 0) {
      barra.classList.add('visivel');
      texto.textContent = `${idsSelecionados.size} selecionado${idsSelecionados.size !== 1 ? 's' : ''}`;
    } else {
      barra.classList.remove('visivel');
    }
  }

  document.getElementById('lista-area').addEventListener('click', (e) => {
    const btnDetalhe = e.target.closest('.btn-ver-detalhes');
    if (btnDetalhe) {
      const card = btnDetalhe.closest('.solicitacao-card');
      const painel = card.querySelector('.solicitacao-detalhe-expandido');
      const aberto = painel.style.display !== 'none';
      painel.style.display = aberto ? 'none' : 'block';
      btnDetalhe.textContent = aberto ? 'Ver detalhes completos' : 'Ocultar detalhes';
      return;
    }

    const btn = e.target.closest('button[data-acao]');
    if (!btn) return;

    const id = btn.dataset.id;
    const acao = btn.dataset.acao;

    if (acao === 'aprovar') return aprovar(id);
    if (acao === 'rejeitar') return abrirModalRejeitar(id);
    if (acao === 'remover') return remover(id);
    if (acao === 'erro-resolver') return resolverErro(id);
    if (acao === 'erro-remover') return removerErro(id);
  });

  // checkbox de seleção (delegação separada, porque é um <input>, não <button>)
  document.getElementById('lista-area').addEventListener('change', (e) => {
    const checkbox = e.target.closest('.solicitacao-checkbox');
    if (!checkbox) return;

    const id = parseInt(checkbox.dataset.id, 10);
    if (checkbox.checked) {
      idsSelecionados.add(id);
    } else {
      idsSelecionados.delete(id);
    }

    checkbox.closest('.solicitacao-card').classList.toggle('card-selecionado', checkbox.checked);
    atualizarBarraSelecao();
  });

  document.getElementById('btn-limpar-selecao').addEventListener('click', () => {
    idsSelecionados.clear();
    document.querySelectorAll('.solicitacao-checkbox').forEach(cb => { cb.checked = false; });
    document.querySelectorAll('.card-selecionado').forEach(c => c.classList.remove('card-selecionado'));
    atualizarBarraSelecao();
  });

  document.getElementById('btn-remover-selecionados').addEventListener('click', async () => {
    if (idsSelecionados.size === 0) return;
    if (!confirm(`Remover ${idsSelecionados.size} grupo(s) selecionado(s)? Esta ação não pode ser desfeita.`)) return;

    const btn = document.getElementById('btn-remover-selecionados');
    btnCarregando(btn, true);

    try {
      await apiFetch('/admin/grupos/remover-em-lote', {
        method: 'POST',
        body: JSON.stringify({ ids: Array.from(idsSelecionados) })
      });
      idsSelecionados.clear();
      atualizarBarraSelecao();
      carregarLista();
    } catch (err) {
      alert(err.message);
    } finally {
      btnCarregando(btn, false);
    }
  });

  document.getElementById('btn-verificar-links').addEventListener('click', async () => {
    const btn = document.getElementById('btn-verificar-links');
    btnCarregando(btn, true);

    try {
      const resp = await apiFetch('/admin/grupos/verificar-links', { method: 'POST' });
      alert(`Verificação concluída: ${resp.verificados} grupo(s) checado(s), ${resp.indisponiveis} marcado(s) como indisponível.`);
      carregarLista();
    } catch (err) {
      alert(err.message);
    } finally {
      btnCarregando(btn, false);
    }
  });

  document.getElementById('btn-limpar-rejeitados').addEventListener('click', async () => {
    if (!confirm('Remover TODOS os grupos rejeitados permanentemente? Esta ação não pode ser desfeita.')) return;

    const btn = document.getElementById('btn-limpar-rejeitados');
    btnCarregando(btn, true);

    try {
      const resp = await apiFetch('/admin/grupos/rejeitados', { method: 'DELETE' });
      alert(`${resp.removidos} grupo(s) rejeitado(s) removido(s).`);
      carregarLista();
    } catch (err) {
      alert(err.message);
    } finally {
      btnCarregando(btn, false);
    }
  });

  document.getElementById('filtro-categoria-aprovados').addEventListener('change', (e) => {
    categoriaFiltro = e.target.value;
    carregarLista();
  });

  let timeoutBusca = null;
  document.getElementById('busca-nome-aprovados').addEventListener('input', (e) => {
    clearTimeout(timeoutBusca);
    timeoutBusca = setTimeout(() => {
      buscaNome = e.target.value.trim();
      carregarLista();
    }, 400);
  });

  async function aprovar(id) {
    if (!confirm('Aprovar este grupo? Ele ficará visível publicamente no site.')) return;
    try {
      await apiFetch(`/admin/grupos/${id}/aprovar`, { method: 'POST' });
      carregarLista();
    } catch (err) {
      alert(err.message);
    }
  }

  function abrirModalRejeitar(id) {
    idEmRejeicao = id;
    document.getElementById('motivo-rejeicao').value = '';
    limparAviso('aviso-rejeitar');
    document.getElementById('modal-rejeitar').classList.add('aberto');
  }

  function fecharModalRejeitar() {
    document.getElementById('modal-rejeitar').classList.remove('aberto');
    idEmRejeicao = null;
  }

  document.getElementById('fechar-modal-rejeitar').addEventListener('click', fecharModalRejeitar);
  document.getElementById('cancelar-rejeitar').addEventListener('click', fecharModalRejeitar);

  document.getElementById('confirmar-rejeitar').addEventListener('click', async () => {
    const motivo = document.getElementById('motivo-rejeicao').value.trim();
    if (motivo.length < 5) {
      return mostrarAviso('aviso-rejeitar', 'Escreva um motivo com pelo menos 5 caracteres.');
    }
    try {
      await apiFetch(`/admin/grupos/${idEmRejeicao}/rejeitar`, {
        method: 'POST',
        body: JSON.stringify({ motivo })
      });
      fecharModalRejeitar();
      carregarLista();
    } catch (err) {
      mostrarAviso('aviso-rejeitar', err.message);
    }
  });

  async function remover(id) {
    if (!confirm('Remover este grupo do site? Esta ação não pode ser desfeita.')) return;
    try {
      await apiFetch(`/admin/grupos/${id}`, { method: 'DELETE' });
      carregarLista();
    } catch (err) {
      alert(err.message);
    }
  }


  async function resolverErro(id) {
    try {
      await apiFetch(`/admin/erros/${id}/resolver`, { method: 'POST' });
      carregarLista();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerErro(id) {
    if (!confirm('Remover este relato de erro do painel?')) return;
    try {
      await apiFetch(`/admin/erros/${id}`, { method: 'DELETE' });
      carregarLista();
    } catch (err) {
      alert(err.message);
    }
  }

  document.querySelectorAll('.admin-aba').forEach(aba => {
    aba.addEventListener('click', () => {
      document.querySelectorAll('.admin-aba').forEach(a => a.classList.remove('ativa'));
      aba.classList.add('ativa');
      abaAtual = aba.dataset.status;
      categoriaFiltro = '';
      buscaNome = '';
      document.getElementById('filtro-categoria-aprovados').value = '';
      document.getElementById('busca-nome-aprovados').value = '';
      carregarLista();
    });
  });

  async function carregarCategoriasFiltro() {
    const sel = document.getElementById('filtro-categoria-aprovados');
    try {
      const cats = await apiFetch('/grupos/categorias');
      cats.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.slug;
        opt.textContent = cat.nome;
        sel.appendChild(opt);
      });
    } catch {}
  }

  async function abrirModalImportar() {
    document.getElementById('campo-importar-lote').value = '';
    document.getElementById('lote-descricao').value = '';
    document.getElementById('resultado-importacao').innerHTML = '';
    limparAviso('aviso-importar');

    document.querySelectorAll('#regras-lista input[type="checkbox"]').forEach(cb => { cb.checked = false; });

    const sel = document.getElementById('lote-categoria');
    sel.innerHTML = '<option value="">Selecione a categoria do lote...</option>';
    try {
      const cats = await apiFetch('/grupos/categorias');
      cats.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.slug;
        opt.textContent = cat.nome;
        sel.appendChild(opt);
      });
    } catch {}

    document.getElementById('modal-importar').classList.add('aberto');
  }

  document.getElementById('lote-categoria').addEventListener('change', (e) => {
    const slug = e.target.value;
    const desc = descricoesPorCategoria[slug] || '';
    document.getElementById('lote-descricao').value = desc;
  });

  function fecharModalImportar() {
    document.getElementById('modal-importar').classList.remove('aberto');
  }

  document.getElementById('btn-importar-lote').addEventListener('click', abrirModalImportar);
  document.getElementById('fechar-modal-importar').addEventListener('click', fecharModalImportar);
  document.getElementById('cancelar-importar').addEventListener('click', fecharModalImportar);

  document.getElementById('confirmar-importar').addEventListener('click', async () => {
    limparAviso('aviso-importar');

    const links = document.getElementById('campo-importar-lote').value.trim();
    const categoriaSlug = document.getElementById('lote-categoria').value;
    const descricao = document.getElementById('lote-descricao').value.trim();

    if (!categoriaSlug) return mostrarAviso('aviso-importar', 'Selecione uma categoria.');
    if (!descricao) return mostrarAviso('aviso-importar', 'Preencha a descrição genérica.');
    if (!links) return mostrarAviso('aviso-importar', 'Cole ao menos um link.');

    const regras = [];
    document.querySelectorAll('#regras-lista input[type="checkbox"]:checked').forEach(cb => {
      regras.push(cb.value);
    });

    const btn = document.getElementById('confirmar-importar');
    btnCarregando(btn, true);

    try {
      const resp = await apiFetch('/admin/grupos/importar-lote', {
        method: 'POST',
        body: JSON.stringify({ links, categoria_slug: categoriaSlug, descricao, regras })
      });

      const resultadoDiv = document.getElementById('resultado-importacao');
      resultadoDiv.innerHTML = `
        <p style="margin-bottom:8px;"><strong>${resp.sucesso} de ${resp.total}</strong> importados com sucesso.</p>
        ${resp.resultados.filter(r => !r.ok).map(r => `
          <div style="color:var(--vermelho); margin-bottom:4px;">✗ ${escaparHtml(r.linha)} — ${escaparHtml(r.erro)}</div>
        `).join('')}
      `;

      if (resp.sucesso > 0 && abaAtual === 'aprovado') {
        carregarLista();
      }
    } catch (err) {
      mostrarAviso('aviso-importar', err.message);
    } finally {
      btnCarregando(btn, false);
    }
  });

  carregarCategoriasFiltro();
  carregarLista();
</script>
</body>
</html>
