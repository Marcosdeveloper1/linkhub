<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — LinkHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .pagina-admin { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }
    .admin-cabecalho { margin-bottom: 24px; }
    .admin-abas { display: flex; gap: 4px; border-bottom: 1px solid var(--cinza-borda); margin-bottom: 24px; }
    .admin-aba {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--cinza-texto);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      background: none;
      border-left: none; border-right: none; border-top: none;
      font-family: var(--font);
    }
    .admin-aba.ativa { color: var(--verde-escuro); border-bottom-color: var(--verde-claro); }
    .lista-solicitacoes { display: flex; flex-direction: column; gap: 14px; }
    .solicitacao-card { display: flex; flex-direction: column; gap: 10px; }
    .solicitacao-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .solicitacao-nome { font-size: 1.05rem; font-weight: 600; }
    .solicitacao-meta { font-size: 0.8rem; color: var(--cinza-texto); margin-top: 2px; }
    .solicitacao-desc { font-size: 0.9rem; color: var(--preto); line-height: 1.5; }
    .solicitacao-contato { font-size: 0.825rem; color: var(--cinza-texto); }
    .solicitacao-acoes { display: flex; gap: 8px; margin-top: 4px; }
    .motivo-rejeicao-exibido {
      background: #fff5f5;
      border-left: 3px solid var(--vermelho);
      padding: 8px 12px;
      font-size: 0.825rem;
      color: #842029;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<header class="navbar" id="navbar"></header>

<main class="pagina-admin">
  <div class="admin-cabecalho">
    <h1>Painel Admin</h1>
    <p style="color:var(--cinza-texto); margin-top:6px;">Aprove, rejeite ou remova grupos cadastrados na plataforma.</p>
  </div>

  <div class="admin-abas">
    <button class="admin-aba ativa" data-status="pendente">Pendentes</button>
    <button class="admin-aba" data-status="aprovado">Aprovados</button>
    <button class="admin-aba" data-status="rejeitado">Rejeitados</button>
    <button class="btn btn-contorno btn-sm" id="btn-importar-lote" style="margin-left:auto;">Importar em lote</button>
  </div>

  <div id="lista-area" class="lista-solicitacoes">
    <p style="color:var(--cinza-texto);">Carregando...</p>
  </div>
</main>

<!-- Modal de rejeição -->
<div class="modal-fundo" id="modal-rejeitar">
  <div class="modal-caixa">
    <button class="modal-fechar" id="fechar-modal-rejeitar">&times;</button>
    <h3 class="modal-titulo">Rejeitar solicitação</h3>
    <div id="aviso-rejeitar" class="aviso"></div>
    <div class="form-grupo">
      <label class="form-label" for="motivo-rejeicao">Motivo da rejeição</label>
      <textarea class="form-textarea" id="motivo-rejeicao" placeholder="Explique objetivamente por que o grupo não foi aprovado. O usuário receberá este texto por email." minlength="5" maxlength="500"></textarea>
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-contorno" id="cancelar-rejeitar">Cancelar</button>
      <button class="btn btn-perigo" id="confirmar-rejeitar" style="border-color:var(--vermelho); background:var(--vermelho); color:#fff;">Confirmar rejeição</button>
    </div>
  </div>
</div>

<!-- Modal de importação em lote -->
<div class="modal-fundo" id="modal-importar">
  <div class="modal-caixa" style="max-width:600px;">
    <button class="modal-fechar" id="fechar-modal-importar">&times;</button>
    <h3 class="modal-titulo">Importar grupos em lote</h3>
    <p style="font-size:0.875rem; color:var(--cinza-texto); margin-bottom:12px;">
      Um grupo por linha, no formato <code>link,categoria</code>. A foto e o nome são capturados automaticamente do link.
      Categorias disponíveis: <span id="lista-slugs-categorias">carregando...</span>
    </p>
    <div id="aviso-importar" class="aviso"></div>
    <textarea class="form-textarea" id="campo-importar-lote" rows="8" placeholder="https://chat.whatsapp.com/ABC123...,esportes
https://chat.whatsapp.com/XYZ789...,financas"></textarea>
    <div id="resultado-importacao" style="margin-top:12px; font-size:0.85rem;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-contorno" id="cancelar-importar">Fechar</button>
      <button class="btn btn-primario" id="confirmar-importar">Importar</button>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  iniciarPagina({ requerAdmin: true });

  let abaAtual = 'pendente';
  let idEmRejeicao = null;

  async function carregarLista() {
    const area = document.getElementById('lista-area');
    area.innerHTML = '<p style="color:var(--cinza-texto);">Carregando...</p>';

    try {
      const endpoint = abaAtual === 'pendente' ? '/admin/pendentes' : `/admin/grupos?status=${abaAtual}`;
      const grupos = await apiFetch(endpoint);
      renderizarLista(grupos);
    } catch (err) {
      area.innerHTML = `<p style="color:var(--vermelho);">${err.message}</p>`;
    }
  }

  function renderizarLista(grupos) {
    const area = document.getElementById('lista-area');

    if (grupos.length === 0) {
      area.innerHTML = `
        <div class="estado-vazio">
          <h3>Nada por aqui</h3>
          <p>Não há grupos com este status no momento.</p>
        </div>
      `;
      return;
    }

    area.innerHTML = grupos.map(g => `
      <div class="card solicitacao-card" data-id="${g.id}">
        <div class="solicitacao-topo">
          ${g.foto_url ? `<img src="${escaparHtml(g.foto_url)}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;">` : ''}
          <div>
            <div class="solicitacao-nome">${escaparHtml(g.nome_grupo)}</div>
            <div class="solicitacao-meta">
              <span class="tag tag-verde">${escaparHtml(g.categoria_nome)}</span>
              · Enviado em ${formatarData(g.criado_em)}
            </div>
          </div>
        </div>
        <div class="solicitacao-desc">${escaparHtml(g.descricao)}</div>
        <div class="solicitacao-contato">
          Link: <a href="${g.link_whatsapp}" target="_blank" rel="noopener">${g.link_whatsapp}</a><br>
          Contato: ${escaparHtml(g.nome_contato)} — ${escaparHtml(g.email_contato)}
        </div>
        ${g.status === 'rejeitado' && g.motivo_rejeicao ? `
          <div class="motivo-rejeicao-exibido">Motivo: ${escaparHtml(g.motivo_rejeicao)}</div>
        ` : ''}
        <div class="solicitacao-acoes">
          ${g.status === 'pendente' ? `
            <button class="btn btn-primario btn-sm" data-acao="aprovar" data-id="${g.id}">Aprovar</button>
            <button class="btn btn-perigo btn-sm" data-acao="rejeitar" data-id="${g.id}">Rejeitar</button>
          ` : ''}
          ${g.status === 'aprovado' ? `
            <button class="btn btn-perigo btn-sm" data-acao="remover" data-id="${g.id}">Remover do site</button>
          ` : ''}
        </div>
      </div>
    `).join('');

    area.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', () => { img.style.display = 'none'; });
    });
  }

  function escaparHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // Delegação de eventos — funciona mesmo com a lista sendo recriada a cada carregamento
  document.getElementById('lista-area').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-acao]');
    if (!btn) return;

    const id = btn.dataset.id;
    const acao = btn.dataset.acao;

    if (acao === 'aprovar') return aprovar(id);
    if (acao === 'rejeitar') return abrirModalRejeitar(id);
    if (acao === 'remover') return remover(id);
  });

  async function aprovar(id) {
    if (!confirm('Aprovar este grupo? Ele ficará visível publicamente no site.')) return;
    try {
      await apiFetch(`/admin/grupos/${id}/aprovar`, { method: 'POST' });
      carregarLista();
    } catch (err) {
      alert(err.message);
    }
  }

  function abrirModalRejeitar(id) {
    idEmRejeicao = id;
    document.getElementById('motivo-rejeicao').value = '';
    limparAviso('aviso-rejeitar');
    document.getElementById('modal-rejeitar').classList.add('aberto');
  }

  function fecharModalRejeitar() {
    document.getElementById('modal-rejeitar').classList.remove('aberto');
    idEmRejeicao = null;
  }

  document.getElementById('fechar-modal-rejeitar').addEventListener('click', fecharModalRejeitar);
  document.getElementById('cancelar-rejeitar').addEventListener('click', fecharModalRejeitar);

  document.getElementById('confirmar-rejeitar').addEventListener('click', async () => {
    const motivo = document.getElementById('motivo-rejeicao').value.trim();
    if (motivo.length < 5) {
      return mostrarAviso('aviso-rejeitar', 'Escreva um motivo com pelo menos 5 caracteres.');
    }
    try {
      await apiFetch(`/admin/grupos/${idEmRejeicao}/rejeitar`, {
        method: 'POST',
        body: JSON.stringify({ motivo })
      });
      fecharModalRejeitar();
      carregarLista();
    } catch (err) {
      mostrarAviso('aviso-rejeitar', err.message);
    }
  });

  async function remover(id) {
    if (!confirm('Remover este grupo do site? Esta ação não pode ser desfeita.')) return;
    try {
      await apiFetch(`/admin/grupos/${id}`, { method: 'DELETE' });
      carregarLista();
    } catch (err) {
      alert(err.message);
    }
  }

  document.querySelectorAll('.admin-aba').forEach(aba => {
    aba.addEventListener('click', () => {
      document.querySelectorAll('.admin-aba').forEach(a => a.classList.remove('ativa'));
      aba.classList.add('ativa');
      abaAtual = aba.dataset.status;
      carregarLista();
    });
  });

  async function abrirModalImportar() {
    document.getElementById('campo-importar-lote').value = '';
    document.getElementById('resultado-importacao').innerHTML = '';
    limparAviso('aviso-importar');
    document.getElementById('modal-importar').classList.add('aberto');

    try {
      const cats = await apiFetch('/grupos/categorias');
      document.getElementById('lista-slugs-categorias').textContent = cats.map(c => c.slug).join(', ');
    } catch {
      document.getElementById('lista-slugs-categorias').textContent = 'não foi possível carregar';
    }
  }

  function fecharModalImportar() {
    document.getElementById('modal-importar').classList.remove('aberto');
  }

  document.getElementById('btn-importar-lote').addEventListener('click', abrirModalImportar);
  document.getElementById('fechar-modal-importar').addEventListener('click', fecharModalImportar);
  document.getElementById('cancelar-importar').addEventListener('click', fecharModalImportar);

  document.getElementById('confirmar-importar').addEventListener('click', async () => {
    const linhas = document.getElementById('campo-importar-lote').value.trim();
    limparAviso('aviso-importar');

    if (!linhas) {
      return mostrarAviso('aviso-importar', 'Cole ao menos uma linha.');
    }

    const btn = document.getElementById('confirmar-importar');
    btnCarregando(btn, true);

    try {
      const resp = await apiFetch('/admin/grupos/importar-lote', {
        method: 'POST',
        body: JSON.stringify({ linhas })
      });

      const resultadoDiv = document.getElementById('resultado-importacao');
      resultadoDiv.innerHTML = `
        <p style="margin-bottom:8px;"><strong>${resp.sucesso} de ${resp.total}</strong> importados com sucesso.</p>
        ${resp.resultados.filter(r => !r.ok).map(r => `
          <div style="color:var(--vermelho); margin-bottom:4px;">✗ ${escaparHtml(r.linha)} — ${escaparHtml(r.erro)}</div>
        `).join('')}
      `;

      if (resp.sucesso > 0 && abaAtual === 'aprovado') {
        carregarLista();
      }
    } catch (err) {
      mostrarAviso('aviso-importar', err.message);
    } finally {
      btnCarregando(btn, false);
    }
  });

  carregarLista();
</script>
</body>
</html>
